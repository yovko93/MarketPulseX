<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketProbe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            background: #0f1115;
            color: #e6e6e6;
        }

        h1 {
            margin-bottom: 8px;
        }

        .status {
            margin-bottom: 16px;
            padding: 12px;
            background: #1a1f29;
            border-radius: 8px;
        }

        .ok {
            color: #6ee7b7;
        }

        .bad {
            color: #fca5a5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #151922;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #2b3240;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #1d2430;
        }

        .row-new {
            background: #1b2a22;
        }

        .chart-panel {
            margin-bottom: 16px;
            padding: 12px;
            background: #151922;
            border-radius: 8px;
        }

        .chart-title {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #9aa4b2;
        }

        .chart-title small {
            display: block;
            margin-top: 4px;
            color: #728095;
            font-size: 12px;
            font-weight: normal;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .chart-controls {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #c0c7d1;
        }

        .chart-controls button {
            border: 1px solid #2b3240;
            background: #0f141c;
            color: #e6e6e6;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .chart-controls button:hover {
            background: #1b2330;
        }

        #timeframeSelect {
            border: 1px solid #2b3240;
            background: #0f141c;
            color: #e6e6e6;
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 13px;
        }

        #candleChart {
            width: 100%;
            height: 260px;
            display: block;
            background: #0f141c;
            border: 1px solid #2b3240;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>MarketPulseX Live Ticks</h1>

    <div class="status">
        <div>Hub status: <span id="hubStatus" class="bad">Disconnected</span></div>
        <div>Total ticks: <span id="totalTicks">0</span></div>
        <div>Buffered ticks: <span id="bufferedTicks">0</span></div>
        <div>Last tick UTC: <span id="lastTickUtc">-</span></div>
    </div>

    <div class="chart-panel">
        <div class="chart-header">
            <p id="chartTitle" class="chart-title">
                <span id="chartTitleText">5-second candlestick chart (NQ)</span>
                <small>Scroll over candles/bottom axis for time zoom. Scroll over left price scale for price zoom.</small>
            </p>
            <label class="chart-controls" for="timeframeSelect">
                Timeframe
                <select id="timeframeSelect">
                    <option value="5000">5s</option>
                    <option value="15000">15s</option>
                    <option value="30000">30s</option>
                    <option value="60000">1m</option>
                </select>
            </label>
            <div class="chart-controls">
                <button id="zoomOutButton" type="button">Zoom Out</button>
                <button id="zoomInButton" type="button">Zoom In</button>
                <button id="zoomResetButton" type="button">Reset</button>
            </div>
        </div>
        <canvas id="candleChart" width="1200" height="260"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Price</th>
                <th>Size</th>
                <th>UTC Time</th>
            </tr>
        </thead>
        <tbody id="ticksBody"></tbody>
    </table>

    <script src="/js/signalr/dist/browser/signalr.js"></script>
    <script>
        const hubStatus = document.getElementById("hubStatus");
        const totalTicks = document.getElementById("totalTicks");
        const bufferedTicks = document.getElementById("bufferedTicks");
        const lastTickUtc = document.getElementById("lastTickUtc");
        const ticksBody = document.getElementById("ticksBody");
        const candleChart = document.getElementById("candleChart");
        const chartTitleText = document.getElementById("chartTitleText");
        const timeframeSelect = document.getElementById("timeframeSelect");
        const zoomInButton = document.getElementById("zoomInButton");
        const zoomOutButton = document.getElementById("zoomOutButton");
        const zoomResetButton = document.getElementById("zoomResetButton");
        const chartCtx = candleChart.getContext("2d");

        const timeframeLabels = {
            5000: "5-second",
            15000: "15-second",
            30000: "30-second",
            60000: "1-minute"
        };

        let candleIntervalMs = Number(timeframeSelect.value);
        const maxCandles = 80;
        const defaultVisibleCandles = 40;
        const minVisibleCandles = 10;
        const maxTickHistory = 1000;
        const tickHistory = [];
        const candles = [];
        let visibleCandles = defaultVisibleCandles;
        let priceZoomLevel = 1;
        const minPriceZoomLevel = 1;
        const maxPriceZoomLevel = 6;
        let lastPointer = { x: 0, y: 0 };

        function bucketStartMs(timestampMs) {
            return Math.floor(timestampMs / candleIntervalMs) * candleIntervalMs;
        }

        function formatBucketLabel(startMs) {
            const date = new Date(startMs);
            return date.toISOString().slice(11, 19);
        }

        function upsertCandle(tick) {
            const tickTimeMs = new Date(tick.utcTime).getTime();

            if (Number.isNaN(tickTimeMs)) {
                return;
            }

            const bucketMs = bucketStartMs(tickTimeMs);
            const price = Number(tick.price);

            if (Number.isNaN(price)) {
                return;
            }

            let candle = candles.find(c => c.startMs === bucketMs);

            if (!candle) {
                candle = {
                    startMs: bucketMs,
                    open: price,
                    high: price,
                    low: price,
                    close: price
                };
                candles.push(candle);
                candles.sort((a, b) => a.startMs - b.startMs);
            } else {
                candle.high = Math.max(candle.high, price);
                candle.low = Math.min(candle.low, price);
                candle.close = price;
            }

            while (candles.length > maxCandles) {
                candles.shift();
            }
        }

        function trackTick(tick) {
            tickHistory.push(tick);
            while (tickHistory.length > maxTickHistory) {
                tickHistory.shift();
            }
        }

        function rebuildCandlesFromHistory() {
            candles.length = 0;
            for (const tick of tickHistory) {
                upsertCandle(tick);
            }
            renderCandles();
        }

        function updateChartTitle() {
            const label = timeframeLabels[candleIntervalMs] ?? `${Math.round(candleIntervalMs / 1000)}-second`;
            chartTitleText.textContent = `${label} candlestick chart (NQ)`;
        }

        function renderCandles() {
            const width = candleChart.width;
            const height = candleChart.height;
            const padding = { top: 16, right: 16, bottom: 28, left: 44 };

            chartCtx.clearRect(0, 0, width, height);

            if (candles.length === 0) {
                chartCtx.fillStyle = "#9aa4b2";
                chartCtx.font = "13px Arial";
                chartCtx.fillText("Waiting for tick data...", 16, 24);
                return;
            }

            const visibleSlice = candles.slice(-visibleCandles);
            const highs = visibleSlice.map(c => c.high);
            const lows = visibleSlice.map(c => c.low);
            const rawMaxPrice = Math.max(...highs);
            const rawMinPrice = Math.min(...lows);
            const rawRange = Math.max(rawMaxPrice - rawMinPrice, 0.01);
            const centerPrice = (rawMaxPrice + rawMinPrice) / 2;
            const scaledRange = rawRange * priceZoomLevel;
            const maxPrice = centerPrice + scaledRange / 2;
            const minPrice = centerPrice - scaledRange / 2;
            const range = Math.max(maxPrice - minPrice, 0.01);

            const chartLeft = padding.left;
            const chartTop = padding.top;
            const chartRight = width - padding.right;
            const chartBottom = height - padding.bottom;
            const chartWidth = chartRight - chartLeft;
            const chartHeight = chartBottom - chartTop;
            const xStep = chartWidth / Math.max(visibleSlice.length, 1);
            const bodyWidth = Math.max(3, xStep * 0.65);
            const horizontalGridLines = 5;
            const verticalGridLines = 6;

            const yForPrice = (price) =>
                chartBottom - ((price - minPrice) / range) * chartHeight;

            chartCtx.strokeStyle = "#1e2532";
            chartCtx.lineWidth = 1;
            for (let i = 0; i <= horizontalGridLines; i++) {
                const y = chartTop + (chartHeight * i) / horizontalGridLines;
                chartCtx.beginPath();
                chartCtx.moveTo(chartLeft, y);
                chartCtx.lineTo(chartRight, y);
                chartCtx.stroke();
            }

            for (let i = 0; i <= verticalGridLines; i++) {
                const x = chartLeft + (chartWidth * i) / verticalGridLines;
                chartCtx.beginPath();
                chartCtx.moveTo(x, chartTop);
                chartCtx.lineTo(x, chartBottom);
                chartCtx.stroke();
            }

            chartCtx.strokeStyle = "#2b3240";
            chartCtx.lineWidth = 1;
            chartCtx.beginPath();
            chartCtx.moveTo(chartLeft, chartTop);
            chartCtx.lineTo(chartLeft, chartBottom);
            chartCtx.lineTo(chartRight, chartBottom);
            chartCtx.stroke();

            chartCtx.fillStyle = "#8b97a8";
            chartCtx.font = "11px Arial";
            for (let i = 0; i <= horizontalGridLines; i++) {
                const price = maxPrice - (range * i) / horizontalGridLines;
                const y = chartTop + (chartHeight * i) / horizontalGridLines;
                chartCtx.fillText(price.toFixed(2), 4, y + 3);
            }

            visibleSlice.forEach((candle, index) => {
                const xCenter = chartLeft + index * xStep + xStep / 2;
                const yHigh = yForPrice(candle.high);
                const yLow = yForPrice(candle.low);
                const yOpen = yForPrice(candle.open);
                const yClose = yForPrice(candle.close);
                const isUp = candle.close >= candle.open;
                const color = isUp ? "#22c55e" : "#ef4444";

                chartCtx.strokeStyle = color;
                chartCtx.beginPath();
                chartCtx.moveTo(xCenter, yHigh);
                chartCtx.lineTo(xCenter, yLow);
                chartCtx.stroke();

                const bodyTop = Math.min(yOpen, yClose);
                const bodyHeight = Math.max(1, Math.abs(yOpen - yClose));

                chartCtx.fillStyle = color;
                chartCtx.fillRect(
                    xCenter - bodyWidth / 2,
                    bodyTop,
                    bodyWidth,
                    bodyHeight
                );

                if (index % Math.ceil(visibleSlice.length / 6) === 0 || index === visibleSlice.length - 1) {
                    chartCtx.fillStyle = "#8b97a8";
                    chartCtx.fillText(
                        formatBucketLabel(candle.startMs),
                        xCenter - 18,
                        height - 8
                    );
                }
            });
        }

        async function loadStatus() {
            try {
                const response = await fetch("/api/status");
                const data = await response.json();

                totalTicks.textContent = data.totalTicks ?? 0;
                bufferedTicks.textContent = data.bufferedTicks ?? 0;
                lastTickUtc.textContent = data.lastTickUtc ?? "-";
            } catch (err) {
                console.error("Status load failed:", err);
            }
        }

        function prependTickRow(tick) {
            const row = document.createElement("tr");
            row.className = "row-new";

            row.innerHTML = `
                        <td>${tick.symbol}</td>
                        <td>${tick.price}</td>
                        <td>${tick.size}</td>
                        <td>${tick.utcTime}</td>
                    `;

            ticksBody.prepend(row);

            while (ticksBody.children.length > 100) {
                ticksBody.removeChild(ticksBody.lastChild);
            }

            setTimeout(() => row.classList.remove("row-new"), 800);
        }

        async function loadInitialTicks() {
            try {
                const response = await fetch("/api/latest?take=20");
                const ticks = await response.json();

                ticksBody.innerHTML = "";
                candles.length = 0;
                tickHistory.length = 0;

                for (const tick of ticks.reverse()) {
                    prependTickRow(tick);
                    trackTick(tick);
                }

                rebuildCandlesFromHistory();
            } catch (err) {
                console.error("Initial ticks load failed:", err);
            }
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hubs/market")
            .withAutomaticReconnect()
            .build();

        connection.on("tick", (tick) => {
            prependTickRow(tick);
            loadStatus();
            trackTick(tick);
            upsertCandle(tick);
            renderCandles();
        });

        timeframeSelect.addEventListener("change", () => {
            candleIntervalMs = Number(timeframeSelect.value);
            updateChartTitle();
            rebuildCandlesFromHistory();
        });

        function clampVisibleCandles(nextValue) {
            const maxVisible = Math.max(minVisibleCandles, candles.length || maxCandles);
            visibleCandles = Math.min(Math.max(nextValue, minVisibleCandles), maxVisible);
        }

        function clampPriceZoom(nextValue) {
            priceZoomLevel = Math.min(Math.max(nextValue, minPriceZoomLevel), maxPriceZoomLevel);
        }

        zoomInButton.addEventListener("click", () => {
            clampVisibleCandles(visibleCandles - 5);
            renderCandles();
        });

        zoomOutButton.addEventListener("click", () => {
            clampVisibleCandles(visibleCandles + 5);
            renderCandles();
        });

        zoomResetButton.addEventListener("click", () => {
            visibleCandles = defaultVisibleCandles;
            priceZoomLevel = 1;
            renderCandles();
        });

        candleChart.addEventListener("mousemove", (event) => {
            const rect = candleChart.getBoundingClientRect();
            const scaleX = candleChart.width / rect.width;
            const scaleY = candleChart.height / rect.height;
            lastPointer = {
                x: (event.clientX - rect.left) * scaleX,
                y: (event.clientY - rect.top) * scaleY
            };
        });

        candleChart.addEventListener("wheel", (event) => {
            event.preventDefault();
            const height = candleChart.height;
            const padding = { top: 16, right: 16, bottom: 28, left: 44 };
            const chartLeft = padding.left;
            const chartBottom = height - padding.bottom;
            const inPriceScale = lastPointer.x <= chartLeft && lastPointer.y >= padding.top && lastPointer.y <= chartBottom;
            const zoomDirection = event.deltaY > 0 ? 1 : -1;

            if (inPriceScale) {
                const priceZoomStep = 0.2;
                clampPriceZoom(priceZoomLevel + zoomDirection * priceZoomStep);
            } else {
                const timeZoomStep = 4;
                clampVisibleCandles(visibleCandles + zoomDirection * timeZoomStep);
            }

            renderCandles();
        }, { passive: false });

        connection.onreconnecting(() => {
            hubStatus.textContent = "Reconnecting...";
            hubStatus.className = "bad";
        });

        connection.onreconnected(() => {
            hubStatus.textContent = "Connected";
            hubStatus.className = "ok";
        });

        connection.onclose(() => {
            hubStatus.textContent = "Disconnected";
            hubStatus.className = "bad";
        });

        async function start() {
            updateChartTitle();
            await loadStatus();
            await loadInitialTicks();

            try {
                await connection.start();
                hubStatus.textContent = "Connected";
                hubStatus.className = "ok";
                console.log("SignalR connected.");
            } catch (err) {
                hubStatus.textContent = "Disconnected";
                hubStatus.className = "bad";
                console.error("SignalR start failed:", err);
                setTimeout(start, 2000);
            }
        }

        start();
        setInterval(loadStatus, 2000);
    </script>
</body>
</html>
